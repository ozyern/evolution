name: Build signed APK
on:
  # Every push to master
  push:
    branches:
      - master
  # Or manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      # Required secrets:
      # - KEYSTORE_BASE64: base64-encoded release keystore (.jks)
      # - KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret; can't sign the APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keyStore.jks
          {
            echo "storeFile=keyStore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          echo "NAME=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Evolution-$name.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Evolution-${{ steps.version.outputs.NAME }}
          path: Evolution-${{ steps.version.outputs.NAME }}.apk

      - name: Clean up signing files
        if: always()
        run: rm -f app/keyStore.jks keystore.properties
