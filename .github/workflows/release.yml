name: Release
on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Or push a version tag, e.g. `git tag v0.0.1 && git push origin v0.0.1`
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      # Required secrets:
      # - KEYSTORE_BASE64: base64-encoded release keystore (.jks)
      # - KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret; can't sign the release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keyStore.jks
          {
            echo "storeFile=keyStore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          echo "NAME=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "OS-Updater-$name.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OS-Updater-${{ steps.version.outputs.NAME }}
          path: OS-Updater-${{ steps.version.outputs.NAME }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.NAME }}
        run: |
          tag="v$NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "OS-Updater-$NAME.apk" --clobber
          else
            gh release create "$tag" "OS-Updater-$NAME.apk" --title "OS Updater $NAME" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Clean up signing files
        if: always()
        run: rm -f app/keyStore.jks keystore.properties
